<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fingerprint Voting System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        body {
            background: linear-gradient(rgba(116, 235, 213, 0.6), rgba(172, 182, 229, 0.6)), url('image.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #34495e, #2c3e50);
            color: #ecf0f1;
            width: 100%;
            padding: 1.5rem 0;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: background 0.3s ease;
            z-index: 10;
            margin: 0 auto;
        }
        header:hover {
            background: linear-gradient(90deg, #2c3e50, #34495e);
        }
        nav {
            background: linear-gradient(90deg, #34495e, #2c3e50);
            padding: 0.75rem 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
            z-index: 10;
            width: 100%;
            margin: 0 auto;
        }
        nav a {
            color: white;
            margin: 0 1.2rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            position: relative;
        }
        nav a::after {
            content: '';
            display: block;
            height: 2px;
            background: #74ebd5;
            width: 0;
            transition: width 0.3s ease;
            position: absolute;
            bottom: -6px;
            left: 0;
        }
        nav a:hover {
            color: #74ebd5;
        }
        nav a:hover::after {
            width: 100%;
        }
        main {
            max-width: 500px;
            margin: 3rem auto 3rem auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem 3.5rem;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeInUp 1s ease forwards;
            opacity: 0;
            border: 5px solid #3498db;
        }
        main.visible {
            opacity: 1;
        }
        .hero {
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .hero p {
            font-size: 1.2rem;
            color: #555;
            margin-top: 0;
            margin-bottom: 2rem;
            font-weight: 500;
        }
        .form-container {
            text-align: left;
            padding: 0 1rem;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 1.8rem;
            border-bottom: 1px solid #74ebd5;
            padding-bottom: 0.5rem;
            margin-top: 0;
        }
        form {
            text-align: left;
        }
        label {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #34495e;
            font-size: 1rem;
            gap: 0.5rem;
        }
        input[type="text"],
        input[type="date"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            font-size: 1.1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }
        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            border-color: #2980b9;
            outline: none;
            box-shadow: 0 0 12px rgba(31, 120, 180, 0.5);
        }
        button[type="submit"] {
            background: linear-gradient(135deg, #2980b9, #74ebd5);
            color: white;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.4);
        }
        button[type="submit"]:hover {
            background: linear-gradient(135deg, #1c5980, #2c3e50);
            box-shadow: 0 6px 18px rgba(28, 89, 128, 0.7);
        }
        footer {
            background: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            margin-top: auto;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        /* Animations */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Responsive */
        @media (max-width: 900px) {
            main {
                width: 90%;
                padding: 2rem 1.5rem;
            }
            nav a {
                margin: 0 0.8rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>Fingerprint Voting System</header>
    <nav>
        <a href="index.html">HOME</a>
        <a href="registervoter.html">REGISTER/VOTER</a>
        <a href="electionofficial.html">ELECTION OFFICIAL</a>
    </nav>
    <main id="mainContent">
        <div class="hero">
            <h1>Welcome to the Fingerprint Voting System</h1>
            <p>Please Fill the Registration Form To Access The Voter or Election Official pages.</p>
        </div>
       
        </div>
    </main>
    <footer>
        &copy; 2025 Fingerprint Voting System. All Rights Reserved To Election Commission of india.
    </footer>

    <script>
        // Fade in main content on page load
        window.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.getElementById('mainContent');
            mainContent.classList.add('visible');
        });
    </script>
</body>
</html>
